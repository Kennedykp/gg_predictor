name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Tests and lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v

      - name: Ruff
        run: ruff check .

      # mypy runs on the pure mathematical core and the tests only. The legacy
      # provider/IO modules are excluded in pyproject.toml (gradual adoption) so
      # this step does not require unrelated refactoring to pass.
      - name: mypy
        run: mypy
